name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install local dependencies & test syntax
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m compileall app.py

      - name: Deploy to PythonAnywhere via API
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          DOMAIN_NAME: "fabriciomg.pythonanywhere.com"
        run: |
          echo "Pulling latest code on PythonAnywhere..."
          curl -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/consoles/shared_with_you/" || true

          # Trigger Git Pull via PythonAnywhere API command execution
          echo "Executing git pull..."
          curl -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            -d "command=cd ~/fabricio-webpage && git pull origin main && source .venv/bin/activate && pip install -r requirements.txt" \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/cpu/" || true

          echo "Reloading PythonAnywhere Web App..."
          RELOAD_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/$DOMAIN_NAME/reload/")

          if [ "$RELOAD_RESPONSE" -eq 200 ]; then
            echo "✅ Web app reloaded successfully!"
          else
            echo "❌ Failed to reload web app. HTTP status: $RELOAD_RESPONSE"
            exit 1
          fi