name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies & test compilation
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m compileall app.py

      - name: Trigger Web App Reload on PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          DOMAIN_NAME: "fabriciomg.pythonanywhere.com"
        run: |
          python -c "
          import os, requests

          username = os.environ['PA_USERNAME'].strip()
          token = os.environ['PA_TOKEN'].strip()
          domain = os.environ['DOMAIN_NAME'].strip()

          headers = {'Authorization': f'Token {token}'}

          url = f'https://www.pythonanywhere.com/api/v0/user/{username}/webapps/{domain}/reload/'
          print(f'Sending reload request to: {url}')

          response = requests.post(url, headers=headers)
          if response.status_code == 200:
              print('✅ Web app reloaded successfully!')
          else:
              print(f'❌ Reload failed with status {response.status_code}:', response.text)
              exit(1)
          "