name: CI/CD Pipeline - Deploy to PythonAnywhere

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: 🧪 Quality Checks & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies via Makefile
        run: make install

      - name: Run Linting & Pytest via Makefile
        env:
          MONGO_URI: "mongodb://localhost:27017/test_db"
        run: make check

  deploy:
    name: 🚀 Deploy to PythonAnywhere
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pull code on PythonAnywhere via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ssh.pythonanywhere.com
          username: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          key: ${{ secrets.PA_SSH_KEY }}
          script: |
            cd /home/${{ secrets.PYTHONANYWHERE_USERNAME }}/fabricio-webpage
            git pull origin main

      - name: Trigger Web App Reload on PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          DOMAIN_NAME: "fabriciomg.pythonanywhere.com"
        run: |
          python -c "
          import os, sys, urllib.request, urllib.error

          username = os.environ.get('PA_USERNAME', '').strip()
          token = os.environ.get('PA_TOKEN', '').strip()
          domain = os.environ.get('DOMAIN_NAME', '').strip()

          if not username or not token:
              print('❌ ERROR: PYTHONANYWHERE_USERNAME o PYTHONANYWHERE_TOKEN no están configurados en GitHub Secrets.')
              sys.exit(1)

          url = f'https://www.pythonanywhere.com/api/v0/user/{username}/webapps/{domain}/reload/'
          print(f'Enviando solicitud de recarga a: {url}')

          req = urllib.request.Request(url, method='POST')
          req.add_header('Authorization', f'Token {token}')

          try:
              with urllib.request.urlopen(req) as response:
                  if response.status == 200:
                      print('✅ ¡Web App recargada con éxito en PythonAnywhere!')
          except urllib.error.HTTPError as e:
              print(f'❌ Error al recargar. Código HTTP: {e.code}')
              print(f'Detalles del servidor: {e.read().decode()}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Error inesperado: {repr(e)}')
              sys.exit(1)
          "